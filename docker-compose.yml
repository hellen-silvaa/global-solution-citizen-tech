# Sobe a API Oportuniza + MySQL 8 em contêineres (desenvolvimento/demonstração).
#   docker compose up -d --build     → API em http://localhost:5080/swagger
#   docker compose down              → para tudo (os dados ficam no volume "mysql-dados")
#   docker compose down -v           → para e apaga o banco
# O MySQL do contêiner usa a porta 3307 no Windows para não conflitar com um MySQL local na 3306.

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copie .env.example para .env}
      MYSQL_DATABASE: oportuniza
    ports:
      - "3307:3306"
    volumes:
      - mysql-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768M

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Development: aplica as 6 migrações + seed ao iniciar e libera o Swagger.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=oportuniza;User=root;Password=${MYSQL_ROOT_PASSWORD:?copie .env.example para .env};"
      Jwt__Secret: ${JWT_SECRET:?copie .env.example para .env}
    ports:
      - "5080:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mysql-dados:
